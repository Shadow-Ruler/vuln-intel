name: keepalive

# GitHub disables scheduled workflows in public repositories after 60 days
# without repository activity. Re-enabling them through the API resets that
# timer, so the pipeline does not depend on what GitHub counts as activity.

on:
  schedule:
    - cron: "19 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in collect.yml keepalive.yml; do
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable"
          done
